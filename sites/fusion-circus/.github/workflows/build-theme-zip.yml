name: Build theme ZIP

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage theme
        run: |
          mkdir -p dist/fusion-circus
          cp -r fusion-circus/. dist/fusion-circus/
          find dist -name '.DS_Store' -delete

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusion-circus
          path: dist
          retention-days: 90
