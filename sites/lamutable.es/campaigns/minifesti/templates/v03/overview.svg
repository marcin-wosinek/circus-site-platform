<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="{{cream}}"/>
  <g id="overview-photos">{{photos}}</g>
  <path id="information-wave" d="M0 550 C180 580 255 510 440 535 S790 595 1080 530 L1080 870 C850 820 750 900 535 865 S190 830 0 885Z" fill="{{cream}}"/>
  <g id="event-title" fill="{{ink}}" font-family="Barlow Condensed" font-weight="800">
    <text x="65" y="605" font-family="Arial" font-weight="400" font-size="31">{{organizer}}</text>
    <text x="58" y="750" font-size="183">{{heading}}</text>
  </g>
  <text id="date" x="65" y="818" font-family="Barlow Condensed" font-weight="800" font-size="53" fill="{{burgundy}}">{{date}}</text>
  <text id="hours" x="1015" y="818" text-anchor="end" font-family="Arial" font-size="34" fill="{{ink}}">{{hours}}</text>
  <g id="venue" font-family="Arial" fill="{{ink}}">
    <text x="65" y="1231" font-size="30">{{venue}}</text>
    <text x="65" y="1274" font-size="26">{{address}}</text>
  </g>
  <image id="brand-logo" x="905" y="595" width="65" height="121" preserveAspectRatio="xMidYMid meet" xlink:href="{{logo}}"/>
</svg>
